name: ramen
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  get_it: ^9.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.3.2
  simple_icons: ^16.23.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  share_plus: ^12.0.2
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/ramen_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0B0C10"
  adaptive_icon_foreground: "assets/icons/ramen_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/ramen_icon.png

dependency_overrides:
  permission_handler_android: 12.1.0
